version: 1
backend:
  phases:
    build:
      commands:
        - nvm use 22 || nvm use 20 || true
        - npm install --cache .npm --include=optional
        - npm install @parcel/watcher-linux-x64-glibc
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
