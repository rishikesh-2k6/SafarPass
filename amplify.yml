version: 1
applications:
  - appRoot: admin_web
    backend:
      phases:
        build:
          commands:
            - nvm use 22 || nvm install 22 || nvm use 20 || true
            - npm ci --cache .npm --include=optional
            - if [ ! -f node_modules/@parcel/watcher-linux-x64-glibc/watcher.node ]; then npm install --no-save @parcel/watcher-linux-x64-glibc; fi
            - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
    frontend:
      phases:
        preBuild:
          commands:
            - nvm use 22 || nvm use 20 || true
            - if [ ! -d node_modules ]; then npm ci --cache .npm --include=optional; fi
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - .npm/**/*
