name: SafarPass CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-verify:
    name: Admin Web & Backend Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin_web

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'admin_web/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Ensure Amplify Outputs Fallback
        run: |
          if [ ! -f amplify_outputs.json ]; then
            echo '{"version":"1.3"}' > amplify_outputs.json
          fi

      - name: TypeScript Static Verification
        run: npx tsc --noEmit

      - name: Build Vite Production Bundle
        run: npm run build

  mobile-build:
    name: Flutter Check & Android Release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_app

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Ensure Amplify Configuration Fallback
        run: |
          mkdir -p lib
          if [ ! -f lib/amplify_outputs.dart ]; then
            echo 'const amplifyConfig = r"{}";' > lib/amplify_outputs.dart
            echo 'const amplifyconfig = amplifyConfig;' >> lib/amplify_outputs.dart
          fi
          if [ ! -f lib/amplifyconfiguration.dart ]; then
            echo 'const amplifyConfig = r"{}";' > lib/amplifyconfiguration.dart
            echo 'const amplifyconfig = amplifyConfig;' >> lib/amplifyconfiguration.dart
          fi

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Analyze Flutter Code
        run: flutter analyze --no-fatal-infos

      - name: Run Widget & Unit Tests
        run: flutter test

      - name: Build Android Release APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: flutter build apk --release

      - name: Upload Release APK Artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: SafarPass-Android-APK
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
